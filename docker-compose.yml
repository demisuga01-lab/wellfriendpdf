services:
  wellfriendpdf:
    build: .
    image: wellfriendpdf-server:latest
    container_name: wellfriendpdf
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WELLFRIENDPDF_PORT: "8080"
      WELLFRIENDPDF_LOG_LEVEL: "info"
      WELLFRIENDPDF_MAX_FILE_SIZE: "52428800"
      WELLFRIENDPDF_MAX_DPI: "600"
      WELLFRIENDPDF_MAX_PAGES: "200"
      WELLFRIENDPDF_API_KEYS: "${WELLFRIENDPDF_API_KEYS:?Set WELLFRIENDPDF_API_KEYS to at least one strong API key}"
      WELLFRIENDPDF_ALLOW_UNAUTHENTICATED: "false"
      WELLFRIENDPDF_RECEIPT_HMAC_KEY_HEX: "${WELLFRIENDPDF_RECEIPT_HMAC_KEY_HEX:?Set WELLFRIENDPDF_RECEIPT_HMAC_KEY_HEX to at least 32 random bytes encoded as hex}"
      WELLFRIENDPDF_RECEIPT_HMAC_KEY_ID: "${WELLFRIENDPDF_RECEIPT_HMAC_KEY_ID:-primary}"
      WELLFRIENDPDF_RECEIPT_HMAC_PREVIOUS_KEYS: "${WELLFRIENDPDF_RECEIPT_HMAC_PREVIOUS_KEYS:-}"
      WELLFRIENDPDF_RECEIPT_HMAC_AUDIENCE: "${WELLFRIENDPDF_RECEIPT_HMAC_AUDIENCE:-wellfriendpdf-server}"
      WELLFRIENDPDF_RECEIPT_HMAC_TTL_SECS: "${WELLFRIENDPDF_RECEIPT_HMAC_TTL_SECS:-900}"
      WELLFRIENDPDF_RATE_LIMIT_PER_MIN: "60"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
