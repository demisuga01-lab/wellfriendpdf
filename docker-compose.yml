services:
  wellfriendpdf:
    build: .
    image: wellfriendpdf-server:latest
    container_name: wellfriendpdf
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WELLFRIENDPDF_PORT: "8080"
      WELLFRIENDPDF_LOG_LEVEL: "info"
      WELLFRIENDPDF_MAX_FILE_SIZE: "52428800"
      WELLFRIENDPDF_MAX_DPI: "600"
      WELLFRIENDPDF_MAX_PAGES: "200"
      WELLFRIENDPDF_API_KEYS: ""
      WELLFRIENDPDF_ALLOW_UNAUTHENTICATED: "true"
      WELLFRIENDPDF_RATE_LIMIT_PER_MIN: "60"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
