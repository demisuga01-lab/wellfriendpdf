[workspace]
resolver = "2"
members = [
    "crates/render-simd",
    "crates/engine",
    "crates/server",
    "crates/cli",
    "crates/wellfriendpdf-capi",
    "crates/wellfriendpdf-wasm",
    "crates/wellfriendpdf-ocr-tesseract",
    "crates/wellfriendpdf-py",
    "crates/wellfriendpdf-edit",
    "crates/wellfriendpdf-editor",
    "crates/wellfriendpdf-editor-wasm",
]
# Plain `cargo build` / `cargo test` at the root skip the optional Tesseract
# OCR backend (product OCR is AI-based; the crate stays for open-source users:
# `cargo build -p wellfriendpdf-ocr-tesseract` or the cli/server `ocr` feature).
default-members = [
    "crates/render-simd",
    "crates/engine",
    "crates/server",
    "crates/cli",
    "crates/wellfriendpdf-capi",
    "crates/wellfriendpdf-wasm",
    "crates/wellfriendpdf-py",
    "crates/wellfriendpdf-edit",
    "crates/wellfriendpdf-editor",
    "crates/wellfriendpdf-editor-wasm",
]

# The document editor (crates/wellfriendpdf-edit) uses lopdf with the
# decryption fixes vendored here.
[patch.crates-io]
lopdf = { path = "vendor/lopdf-unlock" }
# JBIG2 decoding with PDFium's tolerance for adaptive-template pixels that
# point at not-yet-decoded positions (see vendor/hayro-jbig2/README.md).
hayro-jbig2 = { path = "vendor/hayro-jbig2" }

# Release builds use thin link-time optimisation across crates: the renderer
# calls through crate boundaries (engine, render-simd, codecs) on hot paths.
# panic = "abort" is deliberately not used: the engine relies on
# catch_unwind to contain codec panics.
[profile.release]
lto = "thin"
