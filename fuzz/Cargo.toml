[package]
name = "wellfriendpdf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# This crate is intentionally NOT a member of the root workspace (the root
# `Cargo.toml` lists only engine/server/cli). cargo-fuzz needs nightly +
# libFuzzer and pulls in `libfuzzer-sys`; keeping it out of the workspace
# means `cargo build`/`cargo test` on stable never sees it and stays green.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.wellfriendpdf-engine]
path = "../crates/engine"
# Exposes the internal decoder entry points (fuzz_decode_filter, etc.).
features = ["fuzzing"]

# Fuzz targets are built in release with debug assertions + overflow checks on
# so integer-overflow panics and debug_assert! fire during fuzzing.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

# Low-memory dev profile for cargo-fuzz `-D`/`--dev` builds. The engine is a
# single monolithic crate whose non-optional dependency graph (reqwest/tokio,
# image codecs, rustybuzz, CMS/PKIX) makes an ASan + SanitizerCoverage build
# blow past a 4 GiB compile cap when LLVM keeps full debug info in few codegen
# units. Splitting into many small codegen units and dropping debug info keeps
# per-unit LLVM peak memory well under the cap while preserving coverage
# instrumentation (proven on Windows/MSVC under a 4096 MiB Job Object cap; see
# docs/prompt25b_cargo_fuzz_root_cause.md). Keeps debug-assertions/overflow
# checks on so panics still fire. This block only affects the out-of-workspace
# fuzz crate's `--dev` builds; it does not touch the workspace or the release
# fuzz profile the Linux CI gate uses.
[profile.dev]
debug = 0
incremental = false
codegen-units = 256
debug-assertions = true
overflow-checks = true

[[bin]]
name = "parse_pdf"
path = "fuzz_targets/parse_pdf.rs"
test = false
doc = false
bench = false

