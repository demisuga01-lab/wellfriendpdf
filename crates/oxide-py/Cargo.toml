[package]
name = "oxide-py"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings for the Oxide PDF engine."

[lib]
name = "oxide"
crate-type = ["cdylib"]

[dependencies]
oxide-engine = { path = "../engine" }
pyo3 = { version = "0.27.2", features = ["extension-module", "abi3-py39"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
