[package]
name = "wellfriendpdf-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Command-line interface for the Wellfriend pure-Rust PDF toolkit."
repository = "https://github.com/demisuga01-lab/wellfriendpdf"
homepage = "https://github.com/demisuga01-lab/wellfriendpdf"
keywords = ["pdf", "cli", "documents"]
categories = ["command-line-utilities"]

[[bin]]
name = "wellfriendpdf"
path = "src/main.rs"

[dependencies]
wellfriendpdf-engine = { version = "0.1.0", path = "../engine" }
wellfriendpdf-edit = { version = "0.22.0", path = "../wellfriendpdf-edit" }
wellfriendpdf-editor = { version = "0.1.0", path = "../wellfriendpdf-editor" }
wellfriendpdf-ocr-tesseract = { version = "0.1.0", path = "../wellfriendpdf-ocr-tesseract", optional = true }
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde_json = "1"
zip = "2"
mimalloc = { version = "0.1", optional = true, default-features = false }

[features]
default = []
full = ["ocr"]
# Pulls in the Tesseract OCR backend (drives the external `tesseract` process,
# no linked C). Off by default so the standard CLI builds pure-Rust with no OCR
# dependency; `--ocr` errors with an actionable message unless this is enabled.
ocr = ["dep:wellfriendpdf-ocr-tesseract"]
native-cmm-lcms2 = ["wellfriendpdf-engine/native-cmm-lcms2"]
# Use mimalloc (compiled from C by its build script) as the global allocator
# instead of the platform allocator. Off by default: it trades higher peak RSS
# on small documents for less CPU time; see "Global allocator" in
# docs/benchmarks/poppler-pdfium-head-to-head-2026-11.md.
mimalloc = ["dep:mimalloc"]
