[package]
name = "oxide-capi"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "C ABI wrapper for oxide-engine."
repository = "https://github.com/oxide-pdf/oxide"

[lib]
name = "oxide_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
oxide-engine = { version = "0.1.0", path = "../engine" }
serde_json = "1"

[features]
default = []
native-cmm-lcms2 = ["oxide-engine/native-cmm-lcms2"]

[dev-dependencies]
libc = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = { version = "0.2", features = ["builder"] }
der = "0.7"
spki = "0.7"
rand_core = { version = "0.6", features = ["std"] }
