language = "C"
include_guard = "WELLFRIENDPDF_H"
usize_is_size_t = true
cpp_compat = true

# Do not add an export allowlist here. The C crate intentionally exposes a
# large stable ABI and the checked-in header must cover every explicit
# `wellfriendpdf_*` Rust export. `scripts/check-c-api-header-parity.mjs` enforces
# that one-way invariant without loading the native library.
