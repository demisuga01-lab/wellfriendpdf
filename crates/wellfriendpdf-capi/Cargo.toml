[package]
name = "wellfriendpdf-capi"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false
description = "C ABI wrapper for wellfriendpdf-engine."
repository = "https://github.com/demisuga01-lab/wellfriendpdf"

[lib]
name = "wellfriendpdf_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
wellfriendpdf-engine = { version = "0.1.0", path = "../engine" }
serde_json = "1"

[features]
default = []
native-cmm-lcms2 = ["wellfriendpdf-engine/native-cmm-lcms2"]

[dev-dependencies]
libc = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = { version = "0.2", features = ["builder"] }
der = "0.7"
spki = "0.7"
rand_core = { version = "0.6", features = ["std"] }
