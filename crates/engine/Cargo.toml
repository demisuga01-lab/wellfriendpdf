[package]
name = "wellfriendpdf-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Pure-Rust PDF parsing, rendering, authoring, editing, compliance, and signing engine."
repository = "https://github.com/demisuga01-lab/wellfriendpdf-sdk"
documentation = "https://docs.rs/wellfriendpdf-engine"
homepage = "https://github.com/demisuga01-lab/wellfriendpdf-sdk"
keywords = ["pdf", "parser", "rendering", "documents", "signatures"]
categories = ["parser-implementations", "rendering", "text-processing"]
include = ["src/**/*", "examples/**/*", "fonts/*.ttf", "fonts/LICENSE-*.txt", "fonts/README.md"]

[dependencies]
aes = "0.8"
aes-kw = "0.3.1"
aes-gcm = "0.10"
cbc = "0.1"
hmac = "0.12"
hkdf = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
flate2 = "1"
getrandom = "0.2"
hayro-ccitt = "0.3"
hayro-jbig2 = { version = "0.3", default-features = false, features = ["std"] }
hayro-jpeg2000 = { version = "0.3", default-features = false, features = ["std"] }
image-webp = "0.2"
jpeg-decoder = "0.3"
jpeg-encoder = "0.6"
log = "0.4"
md-5 = "0.10"
png = "0.17"
qcms = { version = "0.3", default-features = true }
lcms2 = { version = "6.1.1", optional = true, default-features = true }
rayon = "1"
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ttf-parser = "0.21"
unicode-bidi = "0.3"
url = "2.5"
cms = { version = "0.2", features = ["builder"] }
x509-cert = "0.2"
pkix-path = { version = "0.3.2", features = ["rustcrypto", "std"] }
pkix-path-builder = { version = "0.3.2", features = ["std"] }
pkix-revocation = { version = "0.3.3", features = ["crl", "ocsp"] }
x509-ocsp = { version = "0.2.1", features = ["builder", "std"] }
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
pkcs8 = { version = "0.10", features = ["encryption", "pem"] }
sha1 = { version = "0.10", features = ["oid"] }
const-oid = "0.9"
der = { version = "0.7", features = ["oid"] }
spki = "0.7"
subtle = "2"
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
zopfli = { version = "0.8.3", default-features = false, features = ["std", "zlib"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
p12 = "0.6.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[features]
default = ["parse", "render", "structural"]
full = ["parse", "extract", "render", "create", "edit", "structural", "sign", "pdfa", "ocr"]
parse = []
extract = ["parse"]
render = ["parse"]
create = []
edit = ["create", "structural"]
structural = []
sign = []
pdfa = []
ocr = []
# Prompt 04 native/C codec boundary guard. This compiles no native dependency by
# itself; it only allows future explicitly-registered native backend metadata to
# report as compiled. Defaults remain pure Rust.
native-codecs = []
# Prompt 11B native CMM boundary. Off by default: when enabled, ICCBased
# Gray/RGB/CMYK preview transforms can use the safe Rust `lcms2` wrapper around
# LittleCMS/lcms2. Default, WASM, and package builds keep the qcms fallback path.
native-cmm-lcms2 = ["dep:lcms2"]
# Exposes internal parse/decode entry points (stream filters, etc.) as a
# stable `pub` surface for the out-of-tree `fuzz/` workspace member. Off by
# default so the normal build keeps these implementation details private;
# enabled only when building fuzz targets.
fuzzing = []

[dev-dependencies]
env_logger = "0.11"
proptest = "1"
resvg = { version = "0.47.0", default-features = false, features = ["text", "raster-images"] }
