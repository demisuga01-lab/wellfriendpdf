[package]
name = "wellfriendpdf-edit"
version = "0.22.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Wellfriend PDF SDK document editor: object-bound text, image, vector, annotation, form and page edits behind a JSON command protocol."

[lib]
name = "wellfriend_pdf_edit"
path = "src/lib.rs"

[dependencies]
getrandom = "=0.4.3"
jpeg-decoder = "0.3.2"
lopdf = { version = "0.44.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
url = "2.5.7"
ttf-parser = "0.25.1"
tempfile = "3.24.0"

[dev-dependencies]
jpeg-encoder = "0.6.1"
