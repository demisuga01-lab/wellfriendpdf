[package]
name = "wellfriendpdf-editor-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Browser build of the Wellfriend PDF editor: page rendering, text and object maps, and operation preview with the same code the server replays."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wellfriendpdf-engine = { version = "0.1.0", path = "../engine" }
wellfriendpdf-editor = { version = "0.1.0", path = "../wellfriendpdf-editor" }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
