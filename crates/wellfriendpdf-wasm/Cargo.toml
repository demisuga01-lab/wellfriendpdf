[package]
name = "wellfriendpdf-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false
description = "wasm-bindgen wrapper for wellfriendpdf-engine browser integrations."
repository = "https://github.com/demisuga01-lab/wellfriendpdf"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wellfriendpdf-engine = { version = "0.1.0", path = "../engine" }
serde = "1"
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["panic-hook"]
panic-hook = ["console_error_panic_hook"]
